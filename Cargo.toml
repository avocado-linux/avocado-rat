[package]
name = "avocado-rat"
version = "0.1.0"
edition = "2024"

[lib]
name = "avocado_rat"
path = "src/lib.rs"

[[bin]]
name = "avocado-rat"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt", "macros", "time", "sync", "net", "io-util", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
dirs = "6"
chrono = { version = "0.4", features = ["serde"] }
rand = "0.9"

[profile.release]
strip = true
lto = true
codegen-units = 1
