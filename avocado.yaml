supported_targets: '*'

extensions:
  avocado-ext-tunnels:
    # The extension version tracks the packaged program: CI reads it from Cargo.toml
    # ([package] version) and exports AVOCADO_EXT_VERSION (.github/workflows/release.yml).
    # Locally: `AVOCADO_EXT_VERSION=<x> avocado ext package …` (unset => empty + a warning).
    version: '{{ env.AVOCADO_EXT_VERSION }}'
    release: r1
    summary: Avocado Connect tunnels agent
    description: Avocado Connect tunnels agent
    license: Apache-2.0
    url: https://github.com/avocado-linux/avocado-rat
    vendor: Avocado Linux <info@avocadolinux.org>
    # Stage the Rust source (the repo root IS the project) plus the packaging
    # artifacts, so `ext package` can compile it.
    package_files:
      - overlay
      - avocado.yaml
      - rat-*.sh
      - Cargo.toml
      - Cargo.lock
      - src

    overlay: overlay

    enable_services:
      - avocado-rat.service

    on_merge:
      - systemctl start --no-block avocado-rat.service

    on_unmerge:
      - systemctl stop avocado-rat.service

    packages:
      avocado-rat:
        compile: avocado-rat
        install: rat-install.sh
      wireguard-tools: '*'
      iproute2: '*'
      iptables: '*'
      iproute2-ss: '*'
      kernel-module-wireguard: '*'

    sdk:
      packages:
        nativesdk-binutils: '*'
        nativesdk-cargo: '*'
        nativesdk-gcc: '*'
        nativesdk-glibc-dev: '*'
        nativesdk-libgcc-dev: '*'
        nativesdk-rust: '*'
        packagegroup-rust-cross-canadian-avocado-{{ avocado.target }}: '*'

sdk:
  image: docker.io/avocadolinux/sdk:{{ env.AVOCADO_DISTRO_RELEASE }}

  compile:
    avocado-rat:
      compile: rat-compile.sh
      clean: rat-clean.sh
      packages:
        libstd-rs: '*'
        libstd-rs-dev: '*'
  packages:
    avocado-sdk-toolchain: '*'
